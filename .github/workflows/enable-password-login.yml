name: Enable password login

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch CRM authentication
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          if 'signInWithPassword' in s and 'Temporary password (8+ characters)' in s:
              print('Password login already enabled')
              raise SystemExit(0)

          old = "function Login({onSent}){const [email,setEmail]=useState('');const [busy,setBusy]=useState(false);const [error,setError]=useState('');const submit=async e=>{e.preventDefault();setError('');setBusy(true);const normalized=email.trim().toLowerCase();const {error:authError}=await supabase.auth.signInWithOtp({email:normalized,options:{shouldCreateUser:false,emailRedirectTo:SITE_URL}});if(authError)setError(authError.message);else onSent(normalized);setBusy(false)};return <main className=\"center\"><section className=\"card formcard login-card\"><span className=\"eyebrow\">LEADFLOW • SECURE TEAM LOGIN</span><h2>Team member login</h2><p>Only invited team members can access the CRM and upload leads.</p><form onSubmit={submit}><input type=\"email\" value={email} onChange={e=>setEmail(e.target.value)} placeholder=\"Work email\" required/><button disabled={busy} className=\"primary\">{busy?'Sending secure link…':'Send magic link →'}</button></form>{error&&<div className=\"error\">{error}</div>}<div className=\"notice\">Accounts are created only by the administrator. An email address alone never grants CRM access.</div></section></main>}"
          new = "function Login(){const [email,setEmail]=useState('');const [password,setPassword]=useState('');const [busy,setBusy]=useState(false);const [error,setError]=useState('');const submit=async e=>{e.preventDefault();setError('');setBusy(true);const normalized=email.trim().toLowerCase();const {error:authError}=await supabase.auth.signInWithPassword({email:normalized,password});if(authError)setError(authError.message);setBusy(false)};return <main className=\"center\"><section className=\"card formcard login-card\"><span className=\"eyebrow\">LEADFLOW • SECURE TEAM LOGIN</span><h2>Team member login</h2><p>Use the email and password provided by your administrator.</p><form onSubmit={submit}><input type=\"email\" value={email} onChange={e=>setEmail(e.target.value)} placeholder=\"Work email\" autoComplete=\"username\" required/><input type=\"password\" value={password} onChange={e=>setPassword(e.target.value)} placeholder=\"Password\" autoComplete=\"current-password\" minLength={8} required/><button disabled={busy} className=\"primary\">{busy?'Signing in…':'Sign in →'}</button></form>{error&&<div className=\"error\">{error}</div>}<div className=\"notice\">Accounts are created only by the administrator. Authentication is handled by Supabase; passwords are never stored in this app's frontend.</div></section></main>}"
          if old not in s:
              raise SystemExit('LOGIN_BLOCK_NOT_FOUND')
          s = s.replace(old, new)

          old = "function InvitePanel({members,onRefresh}){const [email,setEmail]=useState('');const [busy,setBusy]=useState(false);const [message,setMessage]=useState('');const [error,setError]=useState('');const [removing,setRemoving]=useState(null);const invite=async e=>{e.preventDefault();setBusy(true);setMessage('');setError('');const {data:{session}}=await supabase.auth.getSession();const {data,error}=await supabase.functions.invoke('admin-invite-member',{body:{email:email.trim().toLowerCase()},headers:{Authorization:`Bearer ${session?.access_token||''}`}});if(error)setError(error.message);else if(data?.error)setError(data.error);else{setMessage(`Invitation sent to ${email.trim().toLowerCase()}.`);setEmail('');await onRefresh()}setBusy(false)};"
          new = "function InvitePanel({members,onRefresh}){const [email,setEmail]=useState('');const [password,setPassword]=useState('');const [busy,setBusy]=useState(false);const [message,setMessage]=useState('');const [error,setError]=useState('');const [removing,setRemoving]=useState(null);const invite=async e=>{e.preventDefault();setBusy(true);setMessage('');setError('');const normalized=email.trim().toLowerCase();if(password.length<8){setError('Password must be at least 8 characters.');setBusy(false);return}const {data:{session}}=await supabase.auth.getSession();const {data,error}=await supabase.functions.invoke('admin-invite-member',{body:{email:normalized,password},headers:{Authorization:`Bearer ${session?.access_token||''}`}});if(error)setError(error.message);else if(data?.error)setError(data.error);else{setMessage(`Account created for ${normalized}. They can now sign in with the password you set.`);setEmail('');setPassword('');await onRefresh()}setBusy(false)};"
          if old not in s:
              raise SystemExit('INVITE_HEAD_NOT_FOUND')
          s = s.replace(old, new)

          old = '<form onSubmit={invite} className=\"invite-form\"><input type=\"email\" value={email} onChange={e=>setEmail(e.target.value)} placeholder=\"Member email\" required/><button className=\"primary\" disabled={busy}>{busy?\'Sending…\':\'Invite member\'}</button></form>'
          new = '<form onSubmit={invite} className=\"invite-form\"><input type=\"email\" value={email} onChange={e=>setEmail(e.target.value)} placeholder=\"Member email\" autoComplete=\"off\" required/><input type=\"password\" value={password} onChange={e=>setPassword(e.target.value)} placeholder=\"Temporary password (8+ characters)\" autoComplete=\"new-password\" minLength={8} required/><button className=\"primary\" disabled={busy}>{busy?\'Creating…\':\'Create account\'}</button></form>'
          if old not in s:
              raise SystemExit('INVITE_FORM_NOT_FOUND')
          s = s.replace(old, new)

          old = "const [loginSent,setLoginSent]=useState(false);const [loginEmail,setLoginEmail]=useState('');"
          s = s.replace(old, '')

          old = "const logout=async()=>{await supabase.auth.signOut();setSession(null);setMember(null);setLeads([]);setMembers([]);setLogs([]);setSelected(null);setView('login');setLoginSent(false)};"
          new = "const logout=async()=>{await supabase.auth.signOut();setSession(null);setMember(null);setLeads([]);setMembers([]);setLogs([]);setSelected(null);setView('login')};"
          if old not in s:
              raise SystemExit('LOGOUT_NOT_FOUND')
          s = s.replace(old, new)

          old = "if(!session||!member){if(loginSent)return <main className=\"center\"><section className=\"card formcard login-card\"><h2>Check your email</h2><p>We sent a secure magic link to <b>{loginEmail}</b>. Open it on this device to sign in.</p><button className=\"primary full\" onClick={()=>setLoginSent(false)}>Back to login</button></section></main>;return <Login onSent={email=>{setLoginEmail(email);setLoginSent(true)}}/>}"
          new = "if(!session||!member){return <Login/>}"
          if old not in s:
              raise SystemExit('LOGIN_RENDER_NOT_FOUND')
          s = s.replace(old, new)
          p.write_text(s)
          print('CRM authentication patched')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git diff --cached --quiet && exit 0
          git commit -m 'Add password authentication for team members'
          git push
